<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            color: #111827;
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
        }
        .result-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
            font-size: 18px;
        }
        .error-box {
            background-color: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 14px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        @media (max-width: 480px) {
            .form-group.full-width {
                grid-column: span 1;
            }
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fff;
        }
        input[type="number"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🏠 House Price Predictor</h1>
            <p class="subtitle">Enter the property details below to estimate its market valuation using the trained XGBoost model.</p>
            
            {% if price is not none %}
                {% if 'Error' in price|string %}
                    <div class="error-box">
                        {{ price }}
                    </div>
                {% else %}
                    <div class="result-box">
                        Estimated Price: ${{ "{:,.2f}".format(price) }}
                    </div>
                {% endif %}
            {% endif %}

            <form method="POST" action="/">
                <div class="grid">
                    <!-- Numerical Features -->
                    <div class="form-group">
                        <label for="area">Total Area (sq ft)</label>
                        <input type="number" id="area" name="area" min="100" max="25000" placeholder="e.g. 4000" required>
                    </div>
                    <div class="form-group">
                        <label for="bedrooms">Bedrooms</label>
                        <input type="number" id="bedrooms" name="bedrooms" min="1" max="10" placeholder="e.g. 3" required>
                    </div>
                    <div class="form-group">
                        <label for="bathrooms">Bathrooms</label>
                        <input type="number" id="bathrooms" name="bathrooms" min="1" max="5" placeholder="e.g. 2" required>
                    </div>
                    <div class="form-group">
                        <label for="stories">Stories/Floors</label>
                        <input type="number" id="stories" name="stories" min="1" max="4" placeholder="e.g. 2" required>
                    </div>
                    <div class="form-group">
                        <label for="parking">Parking Spaces</label>
                        <input type="number" id="parking" name="parking" min="0" max="3" placeholder="e.g. 1" required>
                    </div>

                    <!-- Categorical Features -->
                    <div class="form-group">
                        <label for="furnishingstatus">Furnishing Status</label>
                        <select id="furnishingstatus" name="furnishingstatus" required>
                            <option value="semi-furnished">Semi-Furnished</option>
                            <option value="unfurnished">Unfurnished</option>
                            <option value="furnished">Furnished</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mainroad">Main Road Access</label>
                        <select id="mainroad" name="mainroad" required>
                            <option value="yes">Yes</option>
                            <option value="no">No</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="airconditioning">Air Conditioning</label>
                        <select id="airconditioning" name="airconditioning" required>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="guestroom">Has Guestroom</label>
                        <select id="guestroom" name="guestroom" required>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="basement">Has Basement</label>
                        <select id="basement" name="basement" required>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="hotwaterheating">Hot Water Heating</label>
                        <select id="hotwaterheating" name="hotwaterheating" required>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prefarea">Preferred Area</label>
                        <select id="prefarea" name="prefarea" required>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>
                    </div>
                </div>

                <button type="submit">Predict Property Price</button>
            </form>
        </div>
    </div>
</body>
</html>
